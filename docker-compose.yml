services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    shm_size: 1gb          # Chromium нужна общая память
    mem_limit: 5g          # при утечке упадёт контейнер (и перезапустится), а не весь сервер
    memswap_limit: 6g
    volumes:
      - ./data:/app/data   # сценарии, записи голоса и готовые видео
    logging:               # логи Docker не должны разрастаться
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
